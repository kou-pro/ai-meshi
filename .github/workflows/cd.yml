# CIチェックが通ること確認した上で、Rails, Next を本番環境(ECS Fargate)に自動デプロイ
name: Continuous Delivery

# 当 workflow 実行タイミング
# main ブランチにコード差分が push されたときのみ
on:
  push:
    branches: ["main"]

# OIDC で AWS にトークン送信するために必要な権限
# AWS_ACCESS_KEY_ID/SECRET を使わず、一時クレデンシャルで認証する
permissions:
  id-token: write
  contents: read

# 当 workflow 内で使用できる変数を定義
env:
  AWS_REGION: ap-northeast-1
  ECS_CLUSTER: ai-meshi-cluster
  ECS_SERVICE_BACKEND: ai-meshi-backend-service
  ECS_SERVICE_FRONTEND: ai-meshi-next-service
  ECS_TASK_DEFINITION_BACKEND: ./rails/task-definition.json
  ECS_TASK_DEFINITION_FRONTEND: ./next/task-definition.json
  ECR_REPOSITORY_RAILS: ai-meshi-rails
  ECR_REPOSITORY_NEXT: ai-meshi-next
  CONTAINER_NAME_RAILS: rails
  CONTAINER_NAME_NEXT: ai-meshi-next

jobs:
  # 処理① ci.yml によるチェック (rspec, rubocop, eslint)
  ci:
    uses: ./.github/workflows/ci.yml

  # 処理② Railsの自動デプロイ。動作には ci のクリアが必要
  deploy-rails:
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_RAILS:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_RAILS:latest \
            -f ./rails/Dockerfile.prod \
            ./rails \
            --push
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_RAILS:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Substitute AWS Account ID placeholder
        run: |
          sed -i "s/__AWS_ACCOUNT_ID__/${{ secrets.AWS_ACCOUNT_ID }}/g" ${{ env.ECS_TASK_DEFINITION_BACKEND }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_BACKEND }}
          container-name: ${{ env.CONTAINER_NAME_RAILS }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # 処理③ Next.jsの自動デプロイ。動作には ci のクリアが必要
  deploy-next:
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_NEXT:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_NEXT:latest \
            -f ./next/Dockerfile.prod \
            ./next \
            --push
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_NEXT:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Substitute AWS Account ID placeholder
        run: |
          sed -i "s/__AWS_ACCOUNT_ID__/${{ secrets.AWS_ACCOUNT_ID }}/g" ${{ env.ECS_TASK_DEFINITION_FRONTEND }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_FRONTEND }}
          container-name: ${{ env.CONTAINER_NAME_NEXT }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_FRONTEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

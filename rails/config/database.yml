default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  port: 3306

development:
  <<: *default
  host: db
  database: myapp_development
  password: password

test:
  <<: *default
  host: db
  database: myapp_test
  password: password

production:
  <<: *default
  database: ai_meshi_production
  # TiDB Cloud への接続情報 (ホスト/ユーザー/TLS パラメータ含む) は
  # ホスティング側の環境変数 DATABASE_URL で注入する
  url: <%= ENV["DATABASE_URL"] %>
